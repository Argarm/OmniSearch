version: "3.9"

# Development overrides — mounts source code and enables hot reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    build:
      target: runtime
    volumes:
      - ./backend:/app/backend
      - ./ingestion:/app/ingestion
      - ./config:/app/config
      - hf_model_cache:/app/.cache/huggingface
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"     # Exposed in dev for direct API testing

  frontend:
    volumes:
      - ./frontend:/app/frontend
    command: ["chainlit", "run", "frontend/app.py", "--host", "0.0.0.0", "--port", "8501", "--watch"]

  qdrant:
    ports:
      - "6333:6333"     # Exposed in dev for direct Qdrant dashboard access
      - "6334:6334"     # gRPC port
