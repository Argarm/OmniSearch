[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisearch"
version = "0.1.0"
description = "Internal RAG system — multi-source ingestion, Qdrant vector store, streaming FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ingestion = [
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-core>=0.2",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "notion-client>=2.2",
    "atlassian-python-api>=3.41",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.7",
    "qdrant-client>=1.9",
    "tqdm>=4.66",
]
backend = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "anthropic>=0.30",
    "langchain-anthropic>=0.1",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]
frontend = [
    "chainlit>=1.1",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "backend*", "frontend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
